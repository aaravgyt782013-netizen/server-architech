openapi: 3.1.0
info:
  title: Server Architect
  version: 1.0.0
  description: Securely preview and apply approved Discord server structure changes.
servers:
  - url: https://YOUR-RENDER-SERVICE.onrender.com
    description: Replace with your deployed Render URL.
security:
  - bearerAuth: []
paths:
  /api/status:
    get:
      operationId: getServerStatus
      summary: Check the connected Discord server and bot status
      responses:
        "200":
          description: Bot and server status
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  botReady: { type: boolean }
                  guild:
                    type: object
                    properties:
                      id: { type: string }
                      name: { type: string }
                      memberCount: { type: integer }
                  bot:
                    type: object
                    properties:
                      id: { type: string }
                      username: { type: string }
        "401": { description: Unauthorized }
  /api/plan:
    post:
      operationId: previewServerChanges
      summary: Preview role, category and channel creation without changing the server
      description: Always call this first. Show the preview to the user and obtain approval before applying.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Plan'
      responses:
        "200":
          description: Preview of proposed changes
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  preview: { type: object }
                  confirmationRequired: { type: string }
        "400": { description: Invalid plan }
        "401": { description: Unauthorized }
  /api/apply:
    post:
      operationId: applyApprovedServerChanges
      summary: Apply the exact reviewed plan after user approval
      description: Only call after the user explicitly approves the preview. This endpoint only creates roles, categories and channels. It does not delete or modify existing objects.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Plan'
                - type: object
                  required: [confirm]
                  properties:
                    confirm:
                      type: string
                      enum: [APPLY_SERVER_PLAN]
      responses:
        "200":
          description: Applied operation results
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  result: { type: object }
        "400": { description: Confirmation or validation error }
        "401": { description: Unauthorized }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Plan:
      type: object
      required: [operations]
      properties:
        operations:
          type: array
          minItems: 1
          maxItems: 30
          items:
            oneOf:
              - type: object
                required: [type, name]
                properties:
                  type: { const: create_role }
                  name: { type: string }
                  color: { type: string, example: "#5865F2" }
                  hoist: { type: boolean }
                  mentionable: { type: boolean }
                  permissions:
                    type: array
                    items:
                      type: string
                      enum: [ViewChannel, SendMessages, ReadMessageHistory, Connect, Speak, AddReactions, AttachFiles, EmbedLinks, UseApplicationCommands]
              - type: object
                required: [type, name]
                properties:
                  type: { const: create_category }
                  name: { type: string }
              - type: object
                required: [type, name]
                properties:
                  type: { const: create_text_channel }
                  name: { type: string }
                  category: { type: string }
                  topic: { type: string }
              - type: object
                required: [type, name]
                properties:
                  type: { const: create_voice_channel }
                  name: { type: string }
                  category: { type: string }
